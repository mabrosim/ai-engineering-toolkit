name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag (strict vX.Y.Z)
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must be strict semver vX.Y.Z (got: $GITHUB_REF_NAME)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test installer and package contracts
        run: bash scripts/test-install.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Build release bundle
        run: bash scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Sign tarball
        run: |
          BUNDLE="aet-bundle-${GITHUB_REF_NAME}"
          cosign sign-blob --yes \
            --bundle "${BUNDLE}.tar.gz.cosign.bundle" \
            "${BUNDLE}.tar.gz"

      - name: Sign checksum file
        run: |
          BUNDLE="aet-bundle-${GITHUB_REF_NAME}"
          cosign sign-blob --yes \
            --bundle "${BUNDLE}.sha256.cosign.bundle" \
            "${BUNDLE}.sha256"

      - name: Extract curated release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            BEGIN { version_re=version; gsub(/\./, "\\.", version_re) }
            $0 ~ "^## \\[" version_re "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "error: CHANGELOG.md has no curated section for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE="aet-bundle-${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${BUNDLE}.tar.gz" \
            "${BUNDLE}.sha256" \
            "${BUNDLE}.tar.gz.cosign.bundle" \
            "${BUNDLE}.sha256.cosign.bundle"
